<section id="home" class="hero-section">
  <div class="hero-grid" *ngIf="!loading; else skeleton">
    <div class="hero-copy">
      <p class="eyebrow" data-aos="fade-up">Portfolio / Creative development</p>
      <div class="text-container">
        <h1 class="hero-title text-white" data-aos="fade-up">{{homeContent?.title}} <span>Desouky</span></h1>
        <div class="hero-role" data-aos="fade-up" data-aos-delay="160">
          <span class="hero-role-label">Currently</span>
          <p class="text-white text-animation">{{ currentText }}<span class="cursor" [class.hidden]="reducedMotion">|</span></p>
        </div>
        <p class="desc" [innerHTML]="homeContent?.description" data-aos="fade-up" data-aos-delay="320"></p>
      </div>

      <div class="hero-actions" data-aos="fade-up" data-aos-delay="520">
        <a class="btn1" [href]="staticFiles+homeContent?.cv" download aria-label="Download CV">Download CV</a>
        <a class="hero-link" href="#projects">Explore projects</a>
      </div>

      <div class="social-icons hero-socials" data-aos="fade-right" data-aos-delay="680">
        <a [href]="homeContent?.linkdin" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile"><i class="fa-brands fa-linkedin" aria-hidden="true"></i></a>
        <a [href]="homeContent?.github" target="_blank" rel="noopener noreferrer" aria-label="Open GitHub profile"><i class="fa-brands fa-github" aria-hidden="true"></i></a>
        <a [href]="homeContent?.instagram" target="_blank" rel="noopener noreferrer" aria-label="Open Instagram profile"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
        <a [href]="homeContent?.facebook" target="_blank" rel="noopener noreferrer" aria-label="Open Facebook profile"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a>
      </div>
    </div>

    <div class="hero-visual" data-aos="fade-left" data-aos-delay="760">
      <div class="hero-orb hero-orb-a"></div>
      <div class="hero-orb hero-orb-b"></div>
      <div class="img">
        <img loading="lazy" decoding="async" width="250" height="250" [src]="staticUrl+homeContent?.profileImg" [alt]="homeContent?.logo || homeContent?.title || 'Profile image'">
      </div>
      <div class="hero-card">
        <span class="hero-card-label">Design + Speed</span>
        <strong>Premium, fast, and responsive.</strong>
      </div>
    </div>
  </div>

  <ng-template #skeleton>
    <div class="hero-grid hero-loading">
      <div class="hero-copy">
        <div class="skeleton eyebrow"></div>
        <div class="skeleton title"></div>
        <div class="skeleton subtitle"></div>
        <div class="skeleton text"></div>
        <div class="skeleton text"></div>
        <div class="skeleton icons"></div>
        <div class="skeleton btn"></div>
      </div>
      <div class="hero-visual">
        <div class="skeleton img"></div>
        <div class="skeleton hero-card"></div>
      </div>
    </div>
  </ng-template>
</section>

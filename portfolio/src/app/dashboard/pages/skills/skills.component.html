<div class="dashboard-grid">
  <a
    class="card from-left overall-info"
    appTilt
    routerLink="/dashboard/skills-dashboard/addSkill"
    aria-label="Add skill"
  >
    <div class="card-header">
      <h3>Skills</h3>
    </div>
    <div class="stat-item primary">
      <div class="stat-label">Add Skill</div>
      <div class="stat-number"><i class="fa-solid fa-plus"></i></div>
    </div>
  </a>

  <a
    class="card from-right overall-info"
    appTilt
    routerLink="/dashboard/skills-dashboard/updateSkill"
    aria-label="Edit skill"
  >
    <div class="card-header">
      <h3>Skills</h3>
    </div>
    <div class="stat-item primary">
      <div class="stat-label">Edit Skill</div>
      <div class="stat-number"><i class="fa-solid fa-pen-to-square"></i></div>
    </div>
  </a>
</div>

<h1 class="mt-3">Comments</h1>
<div class="dashboard-grid">
  <article class="card from-left" *ngFor="let msg of messagesList; trackBy: trackByIndex" [attr.aria-label]="msg.name + ' comment'">
    <div class="card-header">
      <h3>{{ msg.name }}</h3>
      <small>{{ msg.email }}</small>
    </div>

    <div class="stat-item primary">
      <div class="stat-label">
        {{ msg.msg }}
      </div>
    </div>

    <div class="card-actions">
      <button type="button" class="btn btn-edit" aria-label="Reply to comment">
        <i class="fa-solid fa-reply"></i> Reply
      </button>
      <button type="button" (click)="deleteMessage(msg._id)" class="btn btn-delete" [attr.aria-label]="'Delete comment from ' + msg.name">
        <i class="fa-solid fa-trash"></i> Delete
      </button>
    </div>
  </article>
</div>
